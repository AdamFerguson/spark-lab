---
# =============================================================================
# spark-lab v3 config — ONE FILE for the whole cluster (ADR-0008).
# -----------------------------------------------------------------------------
# Copy to `config.yaml` and edit for your hosts / model / ports / secrets.
# `spark-lab init` does the copy + .env generation for you.
#
# Secrets are NEVER stored here or in the repo: reference the *name* of an
# environment variable from `.env` (next to this file) and it is injected at
# render time. Per-host-different secrets use per-host env-var names, e.g.
# host sol overrides `litellm: {master_key_env: LITELLM_MASTER_KEY_SOL}`.
# =============================================================================

version: 3

install:
  # Short workspace label used in logs / status output.
  name: spark-lab
  # Where sparkrun recipes + the litellm stack live on each node
  # (per-host overridable). `~/...` is expanded ON THE NODE.
  install_dir: ~/AI
  # The node-side spark-lab checkout that holds the state file (~/spark-lab/.sparklab-state)
  # and what `upgrade` refreshes. Per-host overridable.
  # repo_dir: ~/spark-lab
  # What `spark-lab init --hosts <bare-host> --yes` clones when a node has no
  # checkout yet (skip it if you clone manually).
  # repo_url: git@github.com:<you>/spark-lab.git

# -----------------------------------------------------------------------------
# Managed nodes. `name` = the identifier used with --hosts; `ssh` = connection
# target (Tailscale shortname, user@magic-dns-name, full magic-DNS name, or IP);
# `remote: true` = reach over SSH (Fabric) when we are NOT on that node —
# running spark-lab ON the node converges it locally automatically.
# `remote: false` = this machine (no ssh target needed).
# `ip:` (optional) = the address sparkrun's placement should use for this
# host (its tailnet IP): sparkrun matches layout pins / --hosts against
# cluster host IPs, not hostnames. Without it, the host name is used.
#
# Any other key in an entry is a PER-HOST OVERRIDE, deep-merged over the
# cluster-wide document below (monitoring:, images:, install:, litellm:, ...).
# -----------------------------------------------------------------------------
hosts:
  - name: luna
    ssh: luna                  # Tailscale shortname (user@host also works)
    remote: true
    # Observability-only host: exporter sidecars only -- no LiteLLM gateway,
    # no DB, no Redis (the full host's prometheus scrapes it over the tailnet).
    control_plane:
      enabled: false
    monitoring:
      instance_label: luna
      # 'exporters' = host/GPU exporter sidecars only (no local
      # prometheus/grafana); the 'full' host's prometheus scrapes this one
      # over its `ssh` address. 'full' (default) = the whole observability
      # stack; 'none' = no monitoring services at all.
      role: exporters
  - name: sol
    ssh: sol                   # e.g. user@sol.<your-tailnet>.ts.net instead
    remote: true
    monitoring:
      instance_label: sol
      dashboards:
        - sglang-dashboard
        - spark-host-overview
    images:
      # e.g. keep a node on a pinned gateway image while the rest tracks main-stable
      litellm: ghcr.io/berriai/litellm:v1.99.0

# -----------------------------------------------------------------------------
# Models. `recipe:` = which recipes/<name>.yaml this model is (the launch
# spec -- a plain, directly-runnable sparkrun recipe; `sparkrun run
# recipes/<name>.yaml` works standalone). `hosts:` = where it is served
# (absent = all hosts; `[]` = scaled down everywhere). This list IS the
# scale:
#   spark-lab model up  <model> --hosts sol     adds sol + converges it
#   spark-lab model down <model> --yes --hosts sol   removes sol + stops it there
# At most ONE active model may serve a given host (enforced).
#
# `hf_token_env:` names the .env var carrying the HF token for this model;
# the secret is injected into the RENDERED recipe only (repo recipes stay
# clean; direct sparkrun users authenticate host-side via `hf auth`).
#
# `host_overrides.<host>` deep-merges over the model (for that host) -- the
# per-host escape hatch (params, image, litellm serving identity, ...).
# -----------------------------------------------------------------------------
models:
  qwen38-27b:
    active: true
    # luna has control_plane disabled (exporters-only host), so the gateway --
    # and therefore the API -- lives on sol. Serving is implicit: every active
    # model with a running host is registered in EVERY control-plane host's
    # model_list, with api_base pointing at the running host (sol's entry
    # below points at its own engine; if you set hosts: [luna] instead, sol's
    # entry automatically points at http://luna:30000/v1 -- same model name,
    # clients keep hitting sol).
    hosts: [sol]
    # Launch details live in recipes/qwen38-27b.yaml (a plain sparkrun recipe).
    # spark-lab renders a node-side copy that adds a `layout:` placement pin
    # (from hosts:) + the HF token; gateway name/costs come from the recipe's
    # metadata.litellm section.
    recipe: qwen38-27b
    hf_token_env: HF_TOKEN
    # Optional per-host tailoring (deep-merged over the recipe for that host):
    # host_overrides:
    #   sol:
    #     params: { mamba_ssm_dtype: bfloat16 }
    #     litellm:
    #       model_name: my-gateway-name                 # gateway name on this host
    #       model_info: { max_input_tokens: 262144 }

  # Nemotron 3.5 Lightning 30B-A3B NVFP4 + DFlash speculative decoding
  # (from the SGLang cookbook's dgx-spark cell). Runs on luna; sol's gateway
  # serves it via implicit central serving (its model_list entry points at
  # http://luna:30000/v1 -- clients keep hitting sol). First boot pulls the
  # engine image (~40 GB) and the 1.2 GB DFlash draft into luna's HF cache.
  nemotron35-lightning:
    active: true
    hosts: [luna]
    recipe: nemotron35-lightning
    hf_token_env: HF_TOKEN

  # ------------------------------------------------------------------------
  # A model that SPANS MULTIPLE nodes (a recipe with min_nodes > 1, e.g.
  # tensor-parallel across two Sparks). The model's `hosts:` list is its run
  # pool: the FIRST entry is the head (rank 0) where spark-lab launches the
  # workload and probes readiness; the remaining hosts join as workers -- they
  # converge their control plane / monitoring but never launch the model. No
  # other active model may use those hosts while this one is active: scale
  # qwen38-27b (sol) and nemotron35-lightning (luna) down first, then flip it
  # on with `bin/spark-lab apply --hosts luna,sol --restart-model`. First
  # launch downloads ~164 GiB of weights to BOTH nodes' HF caches.
  glm53-flash-exl3:
    active: false
    hosts: [luna, sol]
    recipe: glm53-flash-exl3      # recipes/glm53-flash-exl3.yaml (min_nodes: 2)
    hf_token_env: HF_TOKEN

  # ------------------------------------------------------------------------
  # A ZOO model (ADR-0010): an INACTIVE model that llama-swap starts on demand
  # when you request it through the gateway, and unloads after `swap.ttl`.
  # Requires top-level `swap.enabled: true`, `active: false`, exactly one host
  # (which must run the control plane), and a single-node recipe. Manage the
  # daemon with `bin/spark-lab zoo prepare` / `swap status`. Swap models are
  # launched by llama-swap (via sparkrun), never by `apply` -- so `model
  # up/down` refuse them and their engine RAM is reclaimed automatically.
  # ------------------------------------------------------------------------
  # nemotron35-lightning:
  #   active: false
  #   hosts: [sol]
  #   recipe: nemotron35-lightning
  #   swap:
  #     enabled: true
  #     class: small          # small=30m, mid=2h, large/pinned=never (or set ttl)
  #     # ttl: 3600           # explicit seconds override (beats class)
  #     aliases: [q27]        # extra gateway names for this model

# -----------------------------------------------------------------------------
# Model swapping (zoo / llama-swap, ADR-0010). When enabled, the swap hosts
# (any host with swap-enabled models) run a llama-swap daemon as a user
# service; requesting a zoo model through the gateway loads it (idle models
# unload). `bin/spark-lab zoo prepare` installs/starts the daemon; downloading
# the llama-swap binary itself stays a deliberate, documented step (OPERATIONS).
# -----------------------------------------------------------------------------
swap:
  enabled: false
  # listen: "0.0.0.0:9292"           # where llama-swap (and the gateway) reach it
  # bin: "~/AI/bin/llama-swap"       # node-side binary path (zoo prepare checks it)
  # sparkrun_bin: sparkrun           # how the daemon's cmd/cmdStop invoke sparkrun

# -----------------------------------------------------------------------------
# Shared stack images (per-host overridable under hosts:). env
# SPARKLAB_IMAGE_<KEY> still wins over everything (see core/config.py).
# -----------------------------------------------------------------------------
images:
  litellm: docker.litellm.ai/berriai/litellm:main-stable
  db: pgvector/pgvector:pg16
  redis: redis:7-alpine
  prometheus: prom/prometheus
  grafana: grafana/grafana
  node_exporter: prom/node-exporter:latest
  dcgm_exporter: utkuozdemir/nvidia_gpu_exporter:latest
  cadvisor: gcr.io/cadvisor/cadvisor:latest
  gpu_textfile: ubuntu:24.04

# -----------------------------------------------------------------------------
# The LiteLLM gateway (per node; one gateway per host).
# model_name/model_info below are the DEFAULTS; a model's host_overrides
# (above) win for that host+model.
# -----------------------------------------------------------------------------
litellm:
  model_name: qwen38-27b
  port: 4000
  model_api_base_host: host.docker.internal
  master_key_env: LITELLM_MASTER_KEY
  salt_key_env: LITELLM_SALT_KEY
  db:
    user: litellm
    password_env: LITELLM_DB_PASSWORD
    db: litellm
  redis:
    enabled: true
    port: 6379
  model_info:
    supports_vision: true
    supports_reasoning: true
    max_input_tokens: 32768
    max_output_tokens: 8192

monitoring:
  enabled: true
  prometheus:
    port: 9090
    retention: 15d
  grafana:
    port: 3000
    admin_password_env: GRAFANA_ADMIN_PASSWORD
  instance_label: spark
  dashboards:
    - sglang-dashboard

network:
  tailscale:
    enabled: true
  cloudflare:
    enabled: false
