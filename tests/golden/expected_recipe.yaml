# Generated by spark-lab from config.yaml -- do not edit by hand.
# Serves test-llm/model via the sglang engine; exposes an OpenAI-compatible API on :30000.
model: test-llm/model
runtime: sglang
min_nodes: 1
# Placement pin: rendered by spark-lab from the config's hosts: list (the
# repo recipe this was rendered from is placement-agnostic). sparkrun honors
# an explicit layout verbatim, on every scheduler.
layout:
  placements:
    - host: 127.0.0.1
      ranks: [0]
container: lmsysorg/sglang:test
executor: docker
executor_config:
  ipc: host
  shm_size: 32g
  # Required on Blackwell / GB10 for this SGLang build.
  # See https://github.com/radixark/miles/issues/364
  privileged: true
  cap_add:
    - SYS_PTRACE
  security_opt:
    - seccomp=unconfined
env:
  PYTORCH_CUDA_ALLOC_CONF: ""
  PYTORCH_ALLOC_CONF: ""
  # Gated model -- the token is injected at deploy time from your .env.
  HF_TOKEN: "test-hf-token"

metadata:
  description: "mylab -- test-llm/model served by sglang"
  model_dtype: nvfp4

# Values available as {name} placeholders inside `command` below.
defaults:
  host: 0.0.0.0
  port: 30000
  kv_cache_dtype: fp8_e4m3
  mem_fraction_static: 0.85
  attention_backend: flashinfer

command: |
  sglang serve \
    --enable-metrics \
    --trust-remote-code \
    --model-path {model} \
    --kv-cache-dtype {kv_cache_dtype} \
    --mem-fraction-static {mem_fraction_static} \
    --attention-backend {attention_backend} \
    --host {host} \
    --port {port}
