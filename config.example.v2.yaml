# =============================================================================
# spark-lab configuration -- SCHEMA v2 (ADR 0004)
# -----------------------------------------------------------------------------
# v2 adds: a keyed `models:` map (multi-model + `active`), a top-level
# `images:` map, and `profile:`/`profiles:` overrides. It is strictly additive:
# the v1 single-`model:` form still works and renders identically.
#
#   spark-lab validate        # pre-flight (schema + render + binaries)
#   spark-lab check images    # resolve + report every image the deploy will pull
#   spark-lab migrate         # rewrite a v1 config.yaml to this shape
#
# Secrets are NEVER stored here. Reference the *name* of an env var under .env.
# =============================================================================

version: 2

install:
  name: my-spark-lab
  install_dir: ~/AI
  hosts:
    - 127.0.0.1
  cluster_name: mylab

# -----------------------------------------------------------------------------
# Models: a keyed map. Exactly one is `active` on a single-node Spark; the
# others are stored definitions you switch to (switch + `apply` = the gated
# model-restart path).
# -----------------------------------------------------------------------------
models:
  qwen38-27b:                       # alias -- used in logs, status, recipe target
    active: true
    hf_model: RadixArk/Qwen3.8-27B-NVFP4
    image: lmsysorg/sglang:qwen38-27b
    hf_token_env: HF_TOKEN
    host: 0.0.0.0
    port: 30000
    min_nodes: 1
    resources:                      # allocation knobs, distinct from SGLang flags
      mem_fraction_static: 0.85     # GPU-memory ceiling (wins over params below)
      node_assignment: auto
      priority: normal
    params:                         # SGLang serve flags (unchanged v1 semantics)
      kv_cache_dtype: fp8_e4m3
      attention_backend: flashinfer
      chunked_prefill_size: 2048
      max_running_requests: 12
      reasoning_parser: qwen3
      tool_call_parser: qwen3_coder
      speculative_algorithm: DSPARK
      speculative_draft_model: RadixArk/Qwen3.8-27B-DSpark
      speculative_draft_attention_backend: flashinfer
    flag_map:
      speculative_draft_model: speculative-draft-model-path
    extra_flags:
      - --enable-metrics

  llama31-8b:                       # a second, stored model -- not active
    active: false
    hf_model: "hf-internal-testing/llama3-8b"   # EXAMPLE -- point at your model
    image: lmsysorg/sglang:latest
    port: 30010
    resources:
      mem_fraction_static: 0.60
    params:
      kv_cache_dtype: fp8_e4m3
    extra_flags:
      - --enable-metrics

# Convenience: name the active alias(es) here instead of editing each model's
# `active` flag. When present this wins. (Single node -> one alias.)
active_models:
  - qwen38-27b

# -----------------------------------------------------------------------------
# Images: every container image in config, overridable. Precedence (high->low):
#   env  SPARKLAB_IMAGE_<KEY>  >  active profile  >  this map  >  (v1 field)  >  default
# -----------------------------------------------------------------------------
images:
  litellm: docker.litellm.ai/berriai/litellm:main-stable
  db: pgvector/pgvector:pg16
  redis: redis:7-alpine
  prometheus: prom/prometheus
  grafana: grafana/grafana
  node_exporter: prom/node-exporter:latest
  dcgm_exporter: utkuozdemir/nvidia_gpu_exporter:latest
  cadvisor: gcr.io/cadvisor/cadvisor:latest
  gpu_textfile: ubuntu:24.04

# -----------------------------------------------------------------------------
# Profiles: dev/test vs prod. The active `profile:` may override any image.
# -----------------------------------------------------------------------------
profile: prod
profiles:
  dev:
    images:
      litellm: ghcr.io/berriai/litellm:latest
      grafana: grafana/grafana:latest

# -----------------------------------------------------------------------------
# Discovery: which recipe sources `spark-lab recipes` searches (ADR 0003).
# Enabling / redirecting a source is a config change, not a code change.
# -----------------------------------------------------------------------------
discovery:
  enabled: true
  cache_dir: .sparklab-state/discovery   # optional: cache fetched bodies
  sources:
    - kind: sparkrun-registry
      alias: local                        # in-repo .sparkrun/registry.yaml + recipes/
    - kind: sglang-cookbook
      alias: cookbook                     # cookbook/sglang.sample.json
  convert:
    llm: false                            # opt-in LLM-assisted `recipes convert`
    # endpoint: http://localhost:4000/v1/chat/completions
    # model: my-spark-model
    # key_env: LITELLM_MASTER_KEY

# -----------------------------------------------------------------------------
# Everything below is unchanged from v1.
# -----------------------------------------------------------------------------
litellm:
  model_name: my-spark-model
  port: 4000
  model_api_base_host: host.docker.internal
  master_key_env: LITELLM_MASTER_KEY
  salt_key_env: LITELLM_SALT_KEY
  db:
    user: litellm
    password_env: LITELLM_DB_PASSWORD
    db: litellm
  redis:
    enabled: true
    port: 6379
  model_info:
    supports_vision: true
    max_input_tokens: 262144
    max_output_tokens: 131072
    input_cost_per_token: 0.00000045
    output_cost_per_token: 0.00000320
    cache_read_input_token_cost: 0.000000045
    supports_reasoning: true
    supported_reasoning_efforts:
      - none
      - low
      - medium
      - xhigh

monitoring:
  enabled: true
  prometheus:
    port: 9090
    retention: 15d
  grafana:
    port: 3000
    admin_password_env: GRAFANA_ADMIN_PASSWORD
  instance_label: spark
  dashboards:
    - sglang-dashboard
    - spark-host-overview

network:
  tailscale:
    enabled: true
  cloudflare:
    enabled: false
    tunnel_token_env: CF_TUNNEL_TOKEN
    public_hostname: llm.example.com
    services:
      - name: litellm
        url: http://localhost:4000
