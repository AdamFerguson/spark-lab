# Qwen3.8-Flash-Next NVFP4 on one DGX Spark (SGLang) — sparkrun recipe.
#
# Conversion of shantanugoel/qwen38-flash-next-sglang-dgx-spark (MIT):
# 125B MoE + 51B n-gram PLE (6B active), native 262k context, MTP speculative
# decode. The checkpoint is ~135 GB; the 48 GB PLE table does not fit in the
# 128 GB UMA pool, so it lives in an NVMe-backed mmap that SGLang's patched
# `qwen4_exp.py` allocates via torch.from_file. The image
# (lmsysorg/sglang:qwen38flashnext) needs two source files patched:
#   - qwen4_exp.py: PLE mmap allocation + shard-reuse fast path (~10 min
#     reboots instead of a 45-60 min re-copy)
#   - qwen_sparse_attn_backend.py: QSA trtllm-gen decode gate widened to
#     sm_120/121 (GB10); FA4-cute fallback does not compile on SM120
# The patches run once on the host (scripts/flash-next-prepare.sh, idempotent)
# and the patched files are bind-mounted back into the image read-only — the
# two ro mounts in executor_config.volumes below.
#
# First boot fills the PLE table (~45-60 min, quiet); later boots ~10 min.
# Non-root: runs as the launching user ($SHELL_USER) so the HF cache and the
# PLE backing file stay host-owned.
#
# Direct (no gateway) smoke test:
#   curl -sS http://127.0.0.1:30000/v1/chat/completions \
#     -H 'Content-Type: application/json' \
#     -d '{"model":"RadixArk/Qwen3.8-Flash-Next-NVFP4","messages":[{"role":"user","content":"12*17"}],"max_tokens":2048,"chat_template_kwargs":{"enable_thinking":false}}'
#   -> expect 204
#
# Client notes (measured upstream, 2026-08-28):
#   - thinking is ON by default; disable with chat_template_kwargs
#     {"enable_thinking": false} (reasoning_effort does nothing on this build).
#   - vision is ON (tower always active with this checkpoint); tool calls use
#     the qwen3_coder parser.
name: qwen38-flash-next
model: RadixArk/Qwen3.8-Flash-Next-NVFP4
model_revision: 7b719225242aacd3dbd3f9407468c2ee9a9d2594
runtime: sglang
min_nodes: 1
container: lmsysorg/sglang:qwen38flashnext
executor: docker
executor_config:
  ipc: host
  shm_size: 16g
  # Required on Blackwell / GB10 for this SGLang build.
  # See https://github.com/radixark/miles/issues/364
  privileged: true
  cap_add:
    - SYS_PTRACE
  security_opt:
    - seccomp=unconfined
  # Non-root: the HF cache + PLE backing file stay host-owned (sparkrun
  # resolves $SHELL_USER to the launching uid:gid and sets HOME=/tmp).
  user: "$SHELL_USER"
  # Keep the container inside the UMA budget the recipe was tuned with
  # (upstream pins 116g; the host has no swap, so --memory-swap is a no-op).
  memory_limit: 116g
  volumes:
    # PLE n-gram table backing dir (SGLANG_QWEN4_PLE_MMAP_DIR=/ple)
    - /home/adam/AI/flash-next/ple:/ple
    # SGlang/flashinfer cache under $HOME (/tmp) so reboots reuse it
    - /home/adam/AI/flash-next/sglang-cache:/tmp/.cache/sglang
    # Patched image sources, mounted read-only over the image's copies
    - /home/adam/AI/flash-next/build/qwen4_exp.py:/sgl-workspace/sglang/python/sglang/srt/models/qwen4_exp.py:ro
    - /home/adam/AI/flash-next/build/qwen_sparse_attn_backend.py:/sgl-workspace/sglang/python/sglang/srt/layers/attention/qwen_sparse_attn_backend.py:ro
env:
  PYTORCH_CUDA_ALLOC_CONF: ""
  PYTORCH_ALLOC_CONF: ""
  # Gated model -- the token is injected at deploy time from your .env.
  HF_TOKEN: "{env:HF_TOKEN}"
  # PLE table backing store (the mmap patch reads this dir for the .bin)
  SGLANG_QWEN4_PLE_MMAP_DIR: /ple
  PYTHONUNBUFFERED: "1"

metadata:
  description: "mylab -- RadixArk/Qwen3.8-Flash-Next-NVFP4 served by SGLang (PLE mmap, QSA sm_121, MTP 3/1/4)"
  model_dtype: nvfp4
  hardware: DGX Spark / GB10
  source: https://github.com/shantanugoel/qwen38-flash-next-sglang-dgx-spark (MIT; patches adapted from hashd1ve/qwen38-flash-next-one-dgx-spark, MIT)

defaults:
  host: 0.0.0.0
  port: 30000

command: |
  sglang serve \
    --model-path {model} \
    --revision 7b719225242aacd3dbd3f9407468c2ee9a9d2594 \
    --trust-remote-code \
    --host {host} \
    --port {port} \
    --quantization modelopt_fp4 \
    --fp4-gemm-backend flashinfer_cutlass \
    --page-size 64 \
    --mamba-radix-cache-strategy extra_buffer \
    --mamba-track-interval 64 \
    --max-mamba-cache-size 20 \
    --mamba-ssm-dtype float32 \
    --chunked-prefill-size 4096 \
    --max-running-requests 4 \
    --max-total-tokens 524288 \
    --context-length 262144 \
    --mem-fraction-static 0.95 \
    --allow-auto-truncate \
    --ple-offload-embedding \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_coder \
    --preferred-sampling-params '{"temperature":1.0,"top_p":0.95,"top_k":20,"min_p":0.0,"presence_penalty":0.0,"repetition_penalty":1.0}' \
    --prefill-attention-backend triton \
    --decode-attention-backend trtllm_mha \
    --disable-prefill-cuda-graph \
    --disable-flashinfer-autotune \
    --enable-metrics \
    --enable-cache-report \
    --enable-gdn-replayssm-spec \
    --speculative-algorithm NEXTN \
    --speculative-num-steps 3 \
    --speculative-eagle-topk 1 \
    --speculative-num-draft-tokens 4 \
    --speculative-draft-model-quantization unquant
