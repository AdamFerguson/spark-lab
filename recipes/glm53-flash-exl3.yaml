# GLM-5.3-Flash EXL3 on a 2× DGX Spark (GB10 / SM121) — sparkrun recipe.
#
# Conversion of MiaAI-Lab/GLM-5.3-Flash-EXL3-2x-DGX-Sparks (MIT) — the
# start.sh / stop.sh / download.sh 2-node launcher. Instead of the kit's
# manual .env + rsync + dual-container dance, this is a plain, directly-runnable
# sparkrun recipe:
#
#     sparkrun run recipes/glm53-flash-exl3.yaml --hosts <head>,<worker>
#
# Or via spark-lab (2-node cluster): add a placement block to config.yaml and
# apply to both hosts -- spark-lab launches the model ONCE from the head (the
# first host in `hosts:`, rank 0) and the worker only converges its control
# plane:
#
#   models:
#     glm53-flash-exl3:
#       active: true
#       hosts: [luna, sol]     # luna = head (rank 0); order sets the head
#       recipe: glm53-flash-exl3
#       hf_token_env: HF_TOKEN
#
#   bin/spark-lab apply --hosts luna,sol
#
#   Because the model spans BOTH Sparks, it can only run while both are freed
#   of their other active models (one active model per host): scale the 27B
#   (sol) and nemotron (luna) down first. spark-lab builds the SSH mesh
#   (luna -> sol), reconciles both control planes, then `sparkrun run --ensure
#   --hosts <ip-luna>,<ip-sol>` (IPs: set `ip:` per host in config.yaml —
#   sparkrun resolves placement against IPs, not hostnames) on luna and polls
#   the health endpoint for up to 1 h -- failing fast (with the launch log
#   tailed) if the launch process crashes instead of polling a dead port.
#
# What sparkrun does for you that start.sh did by hand:
#   * schedules exactly 2 hosts (min_nodes: 2, tensor_parallel: 2 -> 2 ranks)
#   * detects InfiniBand on both nodes and pins NCCL to the CX7 fabric
#     per-node (NCCL_SOCKET_IFNAME / NCCL_IB_HCA / NCCL_IB_GID_INDEX)
#   * pulls the overlay image on the head, ships it to the worker if needed
#   * downloads the EXL3 target (~164 GiB) + DFlash2 draft (~2.3 GiB) into
#     every node's HF cache and mounts it at /cache/huggingface
#   * appends the per-node --nnodes / --node-rank / --master-addr /
#     --master-port (rank 0 = first host = head; workers get --headless)
#
# The image (ghcr.io/miaai-lab/glm-5.3-flash-2x-dgx-sparks:exl3) already
# carries the NoPE sparse-MLA overlay, the EXL3 fused-MoE kernels, the
# DFlash2 speculator, the chat template at /opt/glm53/chat_template.jinja,
# and MOST overlay patches (baked in at build) — so no host file mounts are
# required. IMPORTANT EXCEPTION: patch_glm_video_placeholders.py is applied
# only at container RUNTIME by the kit's /start.sh, not baked in — and it is
# what disables GB10 persistent_topk. This recipe blanks the entrypoint and
# execs `vllm serve` directly (no /start.sh), so that patch is re-applied via
# the `pre_exec` hook below; without it, rank 0 crashes in the sparse-MLA
# indexer during CUDA-graph warmup on SM121.
#
# Gated/size notes:
#   * Target  Mia-AiLab/GLM-5.3-Flash-EXL3-TR3-4bpw  (~164 GiB, 120 shards)
#   * Draft   incoai/GLM-5.3-Flash-DFlash2           (~2.3 GiB, CC BY-NC-ND 4.0)
#   First launch downloads the weights to BOTH nodes; later boots reuse the
#   host HF cache. 1M-context serve is tuned for the 128 GB GB10 UMA pool.
#
# Direct (no gateway) smoke test once it is up:
#   curl -sS http://<head>:8888/v1/chat/completions \
#     -H 'Content-Type: application/json' \
#     -d '{"model":"GLM-5.3-Flash-EXL3",
#          "messages":[{"role":"user","content":"12*17"}],
#          "max_tokens":512,
#          "chat_template_kwargs":{"enable_thinking":false}}'
#
# Thinking is ON by default; disable it with the top-level
# "chat_template_kwargs": {"enable_thinking": false}.

name: glm53-flash-exl3
model: Mia-AiLab/GLM-5.3-Flash-EXL3-TR3-4bpw
# Pinned Hub commit on the durable mirror (byte-identical to the
# brandonmusic/GLM-5.3-Flash-tr3-4bpw snapshot 5ab363a8 that the kit used).
#model_revision: "25a44fdbf16862a46b7cc9921142c6c81350af2f"
# The target pin above is a commit on the target's durable mirror. sparkrun
# otherwise applies model_revision to EVERY distributed model, including the
# DFlash2 draft it auto-detects from speculative_config -- and 25a44fdb… does
# not exist on the draft repo, so the draft download 404s and distribution
# aborts. List both models explicitly: the target leaves revision unset (falls
# back to the mirror pin), the draft carries its own revision so it does not
# inherit the target's commit.
# distribution_config:
#   models:
#     entries:
#       - name: "{model}"
#       - name: incoai/GLM-5.3-Flash-DFlash2
#         revision: main
runtime: vllm-distributed
min_nodes: 2
container: ghcr.io/miaai-lab/glm-5.3-flash-2x-dgx-sparks:exl3
executor: docker
executor_config:
  entrypoint: ""
  ipc: host
  auto_remove: false
  shm_size: 32g
  privileged: true
  cap_add:
    - SYS_PTRACE
    - IPC_LOCK
  # sparkrun renders --ulimit from a LIST of `type=soft[:hard]` strings (its
  # default is ["nofile=65535:65535"]). A MAP here renders as bare
  # `--ulimit memlock` with the value dropped, which docker rejects — the
  # container never launches and Step 5/6 then report "No such container".
  ulimit:
    - memlock=-1
    - stack=67108864
  devices:
    - /dev/infiniband
  security_opt:
    - seccomp=unconfined
  # (No host `volumes:` for the JIT caches: sparkrun quotes a leading `~`
  # literally and docker rejects a non-absolute bind source. The Triton /
  # TileLang cache dirs are instead pointed at sparkrun's already-mounted,
  # persistent /cache/runtime via TRITON_CACHE_DIR / TILELANG_CACHE_DIR below.)

# Pre-serve hook (sparkrun Step 5, run via `docker exec` on every rank before
# `vllm serve`). Applies the ONE overlay patch the image does NOT bake in at
# build: patch_glm_video_placeholders.py, which disables GB10 persistent_topk
# so the sparse-MLA indexer decode uses top_k_per_row_decode. Without it the
# indexer's persistent_topk kernel oversubscribes the SM121 shared-memory
# budget (total_ctas > num_sms*occupancy; fallback needs >=128KB smem, GB10
# has ~99KB) and rank 0 dies during CUDA-graph warmup. The patch is idempotent
# and exits 0 (verified). Local-path recipes are auto-trusted by sparkrun; if
# this recipe is loaded from a registry, mark it trusted or pass --trust so
# pre_exec runs (it is fail-fast).
pre_exec:
  - python3 /opt/glm53/patch_glm_video_placeholders.py

env:
  # --- NCCL over the CX7 fabric (global knobs; per-node IF/HCA/GID are
  #     auto-detected by sparkrun on each host) ---
  NCCL_IB_DISABLE: "0"
  NCCL_IB_ROCE_VERSION_NUM: "2"
  NCCL_IB_GID_INDEX: "3"
  NCCL_NET: IB
  NCCL_NET_PLUGIN: none
  NCCL_NVLS_ENABLE: "0"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_IB_MERGE_NICS: "0"
  NCCL_CROSS_NIC: "0"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  NCCL_DEBUG: WARN
  # --- serve offline from the distributed HF cache (no network at serve) ---
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  # --- GLM-5.3 Flash kit behavior flags ---
  GLM53_SUPPRESS_STOPS_IN_REASONING: "1"
  GLM53_MIXED_PREFILL_CHUNK: skip
  EXL3_FUSED_MOE: "1"
  # --- JIT caches / long cold-start timeouts (TP=2 first JIT can exceed the
  #     stock 300 s EngineCore execute timeout) ---
  # Persist JIT caches on sparkrun's mounted /cache/runtime (absolute, survives
  # container recreate) rather than a broken ~-prefixed host bind mount.
  TRITON_CACHE_DIR: /cache/runtime/triton
  TILELANG_CACHE_DIR: /cache/runtime/tilelang
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  TORCH_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "1"
  VLLM_NO_USAGE_STATS: "1"
  DO_NOT_TRACK: "1"

metadata:
  description: "Mia-AiLab/GLM-5.3-Flash-EXL3-TR3-4bpw (EXL3 + DFlash2) served by vLLM TP=2"
  # (No `model_dtype`: EXL3 is a quantization method, not a dtype — the
  # authoritative setting is the --quantization exl3 flag below.)
  # spark-lab apply probe bound: first boot = image pull + 164 GiB weight load
  # + DFlash2 draft + CUDA-graph capture + shape warmup on a 320B MoE.
  readiness_seconds: 3600
  # spark-lab gateway metadata (sparkrun ignores metadata extras). Served on
  # the cluster gateway under this name.
  litellm:
    model_name: GLM-5.3-Flash-EXL3
    model_info:
      supports_vision: true
      supports_reasoning: true
      supported_reasoning_efforts: [low, medium, high]
      # 524288, not the model's native 1M: the full 1M KV (~15 GiB) leaves too
      # little for activations on the GB10 and the worker OOMs on first forward.
      # 512k is the largest context verified to serve on this 2x DGX Spark
      # (2026-08-30). See the --kv-cache-memory note by the command block.
      max_input_tokens: 524288
      max_output_tokens: 131072
      # Per-token costs for LiteLLM spend tracking (per-million ÷ 1e6):
      # $0.15/M in, $0.50/M out, $0.03/M cache read.
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.0000005
      cache_read_input_token_cost: 0.00000003

# Values available as {name} placeholders inside `command` below.
# (Key order here is part of the rendered recipe -- keep it stable.)
defaults:
  host: 0.0.0.0
  port: 8888
  # 2 ranks across the 2 hosts. sparkrun's vllm-distributed runtime reads this
  # to emit --nnodes 2 + the per-node --node-rank / --master-addr /
  # --master-port (workers additionally get --headless).
  tensor_parallel: 2
  # DFlash2 k=7 speculator. `model` is the draft HF id — sparkrun detects it
  # here and distributes the draft to every node's HF cache, and the same JSON
  # is what vLLM receives on --speculative-config.
  speculative_config: '{"method":"dflash","model":"incoai/GLM-5.3-Flash-DFlash2","num_speculative_tokens":7,"kv_cache_dtype":"auto","draft_sample_method":"probabilistic","rejection_sample_method":"standard","draft_tensor_parallel_size":1}'

# --revision must match model_revision (line ~69). sparkrun downloads the target
# at the pinned commit, but serve runs offline (HF_HUB_OFFLINE=1) and vLLM
# otherwise resolves the model at 'main' -- which has no snapshot in the cache,
# so it dies with LocalEntryNotFoundError before the engine starts. sparkrun does
# not thread model_revision into the serve command or expose it as a {} default,
# so the commit is repeated here. Keep the two in sync if you re-pin.
# --revision 25a44fdbf16862a46b7cc9921142c6c81350af2f \
#
# Memory tuning (verified serving on 2x DGX Spark GB10, 2026-08-30, TP=2):
#   --max-model-len 524288  --gpu-memory-utilization 0.87  --kv-cache-memory 13.5GiB
# The model's native context is 1M, but the KV cache has a large fixed floor
# (~6 GiB: sparse-indexer + hybrid/mamba) plus ~13 KiB/token. Full 1M KV (~15 GiB)
# allocates but leaves too little for activations, so the worker OOMs on the
# first forward. Pinning --kv-cache-memory caps KV and frees activation headroom;
# 512k (13.5 GiB KV, ~1.2x concurrency) is the largest context that serves here.
# 640k allocates KV fine but its init did not complete cleanly. To raise context,
# lower --max-num-batched-tokens (smaller activation peak) and/or trade concurrency.
command: |
    vllm serve {model} \
        --served-model-name GLM-5.3-Flash-EXL3 {model} \
        --host {host} \
        --port {port} \
        --tensor-parallel-size 2 \
        --distributed-executor-backend mp \
        --quantization exl3 \
        --max-model-len 524288 \
        --gpu-memory-utilization 0.87 \
        --kv-cache-memory 14495514624 \
        --max-num-seqs 4 \
        --max-num-batched-tokens 1024 \
        --kv-cache-dtype fp8 \
        --tool-call-parser glm47 \
        --enable-auto-tool-choice \
        --reasoning-parser glm45 \
        --enable-prefix-caching \
        --no-enable-flashinfer-autotune \
        --chat-template /opt/glm53/chat_template.jinja \
        --limit-mm-per-prompt '{"image":4,"video":1}' \
        --skip-mm-profiling \
        --cudagraph-capture-sizes 1 2 4 8 16 24 32 \
        --speculative-config '{speculative_config}'
