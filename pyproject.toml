[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-lab"
version = "0.1.0"
description = "One file + one command to self-host an OpenAI-compatible LLM on an NVIDIA DGX Spark"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "spark-lab contributors" }]
keywords = ["llm", "dgx-spark", "nvidia", "sglang", "vllm", "sparkrun", "litellm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]
# Runtime deps. The single source of truth for the environment is this file:
# `uv lock` pins it into `uv.lock`, and `bin/spark-lab` / `spark-lab upgrade` /
# CI all install from it (uv first, with a `pip install -e .` fallback).
dependencies = [
    "PyYAML>=6.0,<7",
    "Jinja2>=3.1,<4",
    # Remote operator mode: SSH converge against a remote node. Only imported
    # when a config sets install.remote.host, so local mode never touches it.
    "fabric>=3.2,<4",
]

# Test-only / dev deps (PEP 735 dependency groups -- the uv-native way).
# Not installed into the runtime venv; used by the test + lint tooling.
[dependency-groups]
dev = [
    "coverage>=7.0",
    "yamllint>=1.35",
    "ruff>=0.6",
]

[project.scripts]
spark-lab = "sparklab.cli:main"

[tool.setuptools]
packages = ["sparklab", "sparklab.core", "sparklab.commands"]

[tool.setuptools.package-data]
# Ship the Jinja templates + verbatim JSON inside the package so the CLI works
# both from a git checkout and when installed via pip/pipx (ADR 0001).
sparklab = ["templates/**/*"]

[tool.ruff]
line-length = 120          # house style (matches the yamllint budget)
target-version = "py310"
extend-exclude = ["deploy", "recipes/flash-next/patches", "spark_lab.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]   # ruff's pragmatic default set

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]   # sys.path bootstrap before imports is the suite pattern
