name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test config + dummy secrets
        run: |
          cp config.example.yaml config.yaml
          sed -i 's#install_dir: ~/AI#install_dir: /tmp/sparklab-ci#' config.yaml
          printf 'LITELLM_MASTER_KEY=sk-ci-dummy\nLITELLM_SALT_KEY=sk-ci-dummy\nLITELLM_DB_PASSWORD=cidb\nGRAFANA_ADMIN_PASSWORD=cigraf\nHF_TOKEN=\nCF_TUNNEL_TOKEN=\n' > .env

      - name: Dry-run apply (renders every template; fails on undefined vars)
        run: ./bin/spark-lab apply --dry-run

      - name: Validate rendered YAML + docker compose
        run: |
          .venv/bin/python - <<'PY'
          from lib import config, render
          from pathlib import Path
          import yaml, glob
          cfg = config.load('config.yaml')
          render.render(cfg, Path('deploy'))
          files = glob.glob('deploy/**/*.yml', recursive=True) + glob.glob('deploy/**/*.yaml', recursive=True)
          for f in files:
              yaml.safe_load(open(f))
              print('yaml ok:', f)
          PY
          (cd deploy/litellm && docker compose -f docker-compose.yml config -q && echo "compose ok")

      - name: shellcheck
        run: shellcheck bin/spark-lab scripts/capture.sh scripts/secret-scan.sh .githooks/pre-commit

      - name: Unit tests (converge logic: add/remove/switch/no-op/pending)
        run: .venv/bin/python tests/test_converge.py

      - name: yamllint (example config + templates)
        run: |
          pip install yamllint
          yamllint -d '{extends: default, rules: {line-length: {max: 120}, truthy: disable, comments: disable, comments-indentation: disable}}' config.example.yaml templates

      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          ver=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Secret scan (no secrets, ever - same gate as the pre-commit hook)
        run: bash scripts/secret-scan.sh
